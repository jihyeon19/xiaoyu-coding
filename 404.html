<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // Extra-robust static fallback.
      // Many preview hosts fail on directory routes but can open /preview.html.
      const p = window.location.pathname;
      if (p === '/preview' || p === '/preview/') {
        window.location.replace('/preview.html');
      } else {
        window.location.replace('/preview.html');
      }
    </script>
  </head>
  <body>Redirecting...</body>
</html>
